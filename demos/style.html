<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스타일 편집기로 옮겼어요 — 포근섬 이야기</title>
<!-- 6차(M6-P6)에 스타일 편집기는 맨 위 style-editor.html 로 옮겼다 (아티팩트로 게시, 값은 저장소에). 이 주소는 진짜 섬 보기로 넘겨 준다 -->
<script>
  const q = new URLSearchParams(location.search);
  q.set('island', '');
  location.replace(`../style-editor.html?${q.toString().replace(/island=(&|$)/, 'island$1')}`);
</script>
<style>body { font-family: "Malgun Gothic", sans-serif; background: #BFE6F7; color: #4A3B32; padding: 24px; }</style>
</head>
<body>
<p>스타일 편집기는 <a href="../style-editor.html?island">style-editor.html</a> 로 옮겼어요.</p>
</body>
</html>
