<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 모델·스펙 경로(assets/...)가 저장소 맨 위 기준이라 base 를 한 칸 위로 -->
<base href="../">
<title>스타일 편집기 — 포근섬 이야기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
  :root { --ink: #4A3B32; --cream: #FFF8E6; --sand: #F1E4C6; --mint: #5DB7A8; --muted: #7A6656;
    --display: "Jua", "Malgun Gothic", sans-serif; --body: "Gowun Dodum", "Malgun Gothic", sans-serif; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #BFE6F7; color: var(--ink); font-family: var(--body); }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #ui { position: fixed; inset: 0; pointer-events: none; font-family: var(--body); }
  #ui > * { pointer-events: auto; }
  .core-check { position: absolute; left: 50%; top: 16px; transform: translateX(-50%); background: var(--cream); padding: 6px 14px; border-radius: 999px; }
  #touch-controls { position: absolute; inset: 0; pointer-events: none; }
  #touch-controls > * { pointer-events: auto; position: absolute; touch-action: none; user-select: none; }
  .tc-stick { left: 24px; bottom: 24px; width: 120px; height: 120px; border-radius: 50%; background: rgba(255, 248, 230, .45); border: 2px solid rgba(74, 59, 50, .25); }
  .tc-knob { position: absolute; left: 35px; top: 35px; width: 50px; height: 50px; border-radius: 50%; background: var(--cream); }
  .tc-btn { width: 64px; height: 64px; border-radius: 50%; border: 0; background: var(--cream); color: var(--ink); font: 22px var(--display); }
  .tc-a { right: 28px; bottom: 60px; } .tc-b { right: 104px; bottom: 28px; }

  /* 나눠 보기 손잡이 */
  #split { position: fixed; top: 0; bottom: 0; width: 0; z-index: 20; display: none; }
  #split .bar { position: absolute; top: 0; bottom: 0; left: -1px; width: 2px; background: rgba(255, 248, 230, .9); box-shadow: 0 0 0 1px rgba(74, 59, 50, .25); }
  #split .knob { position: absolute; top: 50%; left: -22px; width: 44px; height: 44px; margin-top: -22px; border-radius: 50%; background: var(--cream);
    box-shadow: 0 3px 0 #E2D2AE; display: grid; place-items: center; font: 18px var(--display); cursor: ew-resize; touch-action: none; user-select: none; }
  #split .tag { position: absolute; top: 12px; padding: 3px 10px; border-radius: 999px; background: rgba(255, 248, 230, .92); font-size: 12px; white-space: nowrap; }
  #split .tag.l { right: 10px; } #split .tag.r { left: 10px; }

  /* 조절판 */
  #panel { position: fixed; top: 10px; right: 10px; bottom: 10px; width: 340px; z-index: 30; display: flex; flex-direction: column;
    background: rgba(255, 248, 230, .96); border-radius: 16px; box-shadow: 0 4px 0 #E2D2AE, 0 8px 24px rgba(74, 59, 50, .18); font-size: 13px; }
  #panel header { padding: 10px 12px 6px; display: flex; align-items: center; gap: 8px; }
  #panel header strong { font: 18px var(--display); flex: 1; }
  #panel .row { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 6px; align-items: center; }
  #panel .row .lab { color: var(--muted); font-size: 12px; min-width: 34px; }
  #panel button { border: 0; border-radius: 999px; padding: 4px 11px; background: var(--sand); color: var(--ink); font: inherit; cursor: pointer; }
  #panel button.on { background: var(--mint); color: #fff; }
  #panel button.primary { background: var(--ink); color: var(--cream); }
  #panel .scroll { flex: 1; overflow-y: auto; padding: 0 12px 12px; border-top: 1px dashed #E2D2AE; }
  #panel details { border-bottom: 1px dashed #E2D2AE; padding: 6px 0; }
  #panel summary { font: 15px var(--display); cursor: pointer; padding: 2px 0; }
  .param { display: grid; grid-template-columns: 1fr 52px; gap: 2px 8px; align-items: center; margin: 6px 0; }
  .param label { font-size: 12px; }
  .param .val { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
  .param input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--mint); margin: 0; }
  .param input[type=color] { width: 52px; height: 24px; border: 0; padding: 0; background: none; }
  .param select { font: inherit; border-radius: 8px; border: 1px solid #E2D2AE; background: #fff; }
  .param.changed label::after { content: " •"; color: #E58A6E; }
  #stats { font-size: 11px; color: var(--muted); padding: 0 12px 8px; font-variant-numeric: tabular-nums; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 40; background: var(--ink); color: var(--cream);
    padding: 8px 16px; border-radius: 999px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.show { opacity: 1; }
  #copyBox { display: none; margin: 0 12px 8px; width: calc(100% - 24px); height: 90px; font: 11px monospace; box-sizing: border-box; }
  #panel.min .scroll, #panel.min .row:not(.keep), #panel.min #stats { display: none; }
  #panel.min { bottom: auto; }
  .loading { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); background: var(--cream); padding: 8px 16px; border-radius: 999px; z-index: 50; }
  /* 휴대폰: 아래쪽 판 */
  @media (max-width: 720px) {
    #panel { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; max-height: 52vh; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="game" aria-label="스타일 편집기 게임 화면"></canvas>
<div id="ui"></div>
<div id="split" aria-hidden="true"><div class="bar"></div><div class="tag l" id="tagL">예전</div><div class="tag r" id="tagR">지금 값</div><div class="knob" id="knob">↔</div></div>
<div class="loading" id="loading">섬 불러오는 중…</div>
<section id="panel" aria-label="스타일 조절판">
  <header><strong>스타일 편집기</strong><button type="button" id="minBtn" title="접기">접기</button></header>
  <div class="row keep"><span class="lab">프리셋</span><span id="presetBtns"></span></div>
  <div class="row"><span class="lab">비교</span>
    <button type="button" id="cmpBtn" class="on">나눠 보기</button>
    <select id="cmpPreset" aria-label="왼쪽에 보일 프리셋"></select>
  </div>
  <div class="row"><span class="lab">시간</span>
    <button type="button" data-hour="6.3">새벽</button><button type="button" data-hour="12">낮</button>
    <button type="button" data-hour="18.1">노을</button><button type="button" data-hour="21.5">밤</button>
  </div>
  <div class="row"><span class="lab">날씨</span>
    <button type="button" data-wx="clear">맑음</button><button type="button" data-wx="cloudy">흐림</button>
    <button type="button" data-wx="rain">비</button><button type="button" data-wx="snow">눈</button>
  </div>
  <div class="row"><span class="lab">카메라</span>
    <button type="button" data-zoom="0">가까이</button><button type="button" data-zoom="0.15">기본</button><button type="button" data-zoom="0.7">멀리</button>
    <button type="button" id="hudBtn">게임 글자</button>
  </div>
  <div class="row keep">
    <button type="button" class="primary" id="copyBtn">현재 값 복사</button>
    <button type="button" id="resetBtn">이 프리셋으로 되돌리기</button>
  </div>
  <textarea id="copyBox" readonly aria-label="복사할 값"></textarea>
  <div id="stats"></div>
  <div class="scroll" id="params"></div>
</section>
<div id="toast" role="status"></div>
<script type="module">
// 진짜 섬(main.js 가 모든 모듈을 불러온다) 위에 스타일 조절판을 얹는다.
// 나눠 보기: 왼쪽 = 고른 비교 프리셋, 오른쪽 = 지금 값. 슬라이더를 움직이면 바로 바뀐다.
// "현재 값 복사" → JSON 을 채팅에 붙여 넣으면 그 값으로 프리셋을 고친다. 지금 값은 이 브라우저에만 기억된다.
import './src/main.js';

const $ = s => document.querySelector(s);
const SAVE_KEY = 'island-style-editor-v1';
const toast = text => { const t = $('#toast'); t.textContent = text; t.classList.add('show'); clearTimeout(toast.id); toast.id = setTimeout(() => t.classList.remove('show'), 1800); };
const store = {
  get() { try { return JSON.parse(localStorage.getItem(SAVE_KEY) ?? 'null'); } catch { return null; } },
  set(v) { try { localStorage.setItem(SAVE_KEY, JSON.stringify(v)); } catch { /* 저장 못 해도 편집은 된다 */ } },
};

async function ready() {
  for (;;) {
    const c = window.__island;
    if (c?.services?.style && c.services.world && c.services.player) return c;
    await new Promise(r => setTimeout(r, 100));
  }
}

const ctx = await ready();
$('#loading').remove();
const style = ctx.services.style;
const time = ctx.services.time;
let base = style.preset;                    // 지금 값의 바탕 프리셋
// 처음 나눔 위치: 조절판에 가리지 않는 화면 가운데
const panelW = innerWidth > 720 ? 360 : 0;
let split = { on: true, x: Math.max(0.2, (innerWidth - panelW) / 2 / innerWidth), preset: 'toon' };
let hud = false;
ctx.services.ui?.hud?.show?.(false);

// 저장해 둔 값 되살리기
const saved = store.get();
if (saved?.params) { base = style.presets[saved.preset] ? saved.preset : base; style.set({ preset: base, ...saved.params }); }
if (saved?.split) split = { ...split, ...saved.split };
const remember = () => store.set({ preset: base, params: style.get(), split });

// ── 프리셋 버튼 · 비교 프리셋 ──
const presetBtns = $('#presetBtns');
for (const name of Object.keys(style.presets)) {
  const b = document.createElement('button');
  b.type = 'button'; b.textContent = style.labels[name] ?? name; b.dataset.preset = name;
  b.onclick = () => { base = name; style.use(name); syncAll(); remember(); toast(`${b.textContent} 프리셋`); };
  presetBtns.append(b);
  const o = document.createElement('option');
  o.value = name; o.textContent = `왼쪽: ${style.labels[name] ?? name}`;
  $('#cmpPreset').append(o);
}

// ── 값 슬라이더 (PARAMS 표로 만든다) ──
const inputs = new Map();
const groups = new Map();
const fmt = (p, v) => p.type === 'range' ? (p.step >= 1 ? String(v) : Number(v).toFixed(p.step < 0.01 ? 3 : 2)) : '';
for (const p of style.params) {
  if (!groups.has(p.group)) {
    const d = document.createElement('details');
    d.open = ['명암', '색', '화면 효과'].includes(p.group);
    d.innerHTML = `<summary>${p.group}</summary>`;
    $('#params').append(d);
    groups.set(p.group, d);
  }
  const row = document.createElement('div');
  row.className = 'param';
  const id = `p-${p.key}`;
  const label = `<label for="${id}">${p.label}</label>`;
  if (p.type === 'range') row.innerHTML = `${label}<span class="val"></span><input id="${id}" type="range" min="${p.min}" max="${p.max}" step="${p.step}">`;
  else if (p.type === 'color') row.innerHTML = `${label}<input id="${id}" type="color">`;
  else if (p.type === 'bool') row.innerHTML = `${label}<input id="${id}" type="checkbox">`;
  else row.innerHTML = `${label}<select id="${id}">${p.options.map(([k, t]) => `<option value="${k}">${t}</option>`).join('')}</select>`;
  groups.get(p.group).append(row);
  const el = row.querySelector('input, select');
  const val = row.querySelector('.val');
  const read = () => p.type === 'range' ? Number(el.value) : p.type === 'bool' ? el.checked : el.value;
  el.addEventListener('input', () => {
    style.set({ [p.key]: read() });
    if (val) val.textContent = fmt(p, read());
    markChanged();
    remember();
  });
  inputs.set(p.key, { p, el, val, row });
}

function syncAll() {
  const cur = style.get();
  for (const { p, el, val } of inputs.values()) {
    if (p.type === 'bool') el.checked = !!cur[p.key];
    else el.value = cur[p.key];
    if (val) val.textContent = fmt(p, cur[p.key]);
  }
  for (const b of presetBtns.children) b.classList.toggle('on', b.dataset.preset === base);
  markChanged();
}
function markChanged() {
  const cur = style.get(), ref = style.presets[base];
  for (const { p, row } of inputs.values()) row.classList.toggle('changed', cur[p.key] !== ref[p.key]);
}

// ── 나눠 보기 ──
const splitEl = $('#split');
function applySplit() {
  style.compare({ on: split.on, x: split.x, preset: split.preset });
  splitEl.style.display = split.on ? 'block' : 'none';
  splitEl.style.left = `${split.x * 100}%`;
  $('#cmpBtn').classList.toggle('on', split.on);
  $('#cmpPreset').value = split.preset;
  $('#tagL').textContent = style.labels[split.preset] ?? split.preset;
}
$('#cmpBtn').onclick = () => { split.on = !split.on; applySplit(); remember(); };
$('#cmpPreset').onchange = e => { split.preset = e.target.value; applySplit(); remember(); };
const knob = $('#knob');
knob.addEventListener('pointerdown', e => {
  knob.setPointerCapture(e.pointerId);
  const move = ev => { split.x = Math.min(0.98, Math.max(0.02, ev.clientX / innerWidth)); applySplit(); };
  const up = () => { knob.removeEventListener('pointermove', move); knob.removeEventListener('pointerup', up); remember(); };
  knob.addEventListener('pointermove', move);
  knob.addEventListener('pointerup', up);
});

// ── 시간 · 날씨 · 카메라 ──
for (const b of document.querySelectorAll('[data-hour]')) b.onclick = () => { time.setPaused(true); time.setHour(Number(b.dataset.hour)); };
for (const b of document.querySelectorAll('[data-wx]')) b.onclick = () => time.setWeather(b.dataset.wx, { instant: true });
for (const b of document.querySelectorAll('[data-zoom]')) b.onclick = () => ctx.services.player.camera?.setZoom?.(Number(b.dataset.zoom));
$('#hudBtn').onclick = () => { hud = !hud; ctx.services.ui?.hud?.show?.(hud); $('#hudBtn').classList.toggle('on', hud); };
$('#minBtn').onclick = () => { const m = $('#panel').classList.toggle('min'); $('#minBtn').textContent = m ? '펼치기' : '접기'; };

// ── 복사 · 되돌리기 ──
$('#copyBtn').onclick = async () => {
  const text = JSON.stringify({ preset: base, ...style.get() }, null, 2);
  try { await navigator.clipboard.writeText(text); toast('복사했어요 — 채팅에 붙여 넣어 주세요'); $('#copyBox').style.display = 'none'; }
  catch {
    // 클립보드가 막힌 곳: 글 상자에 담아 옛 방식으로 복사해 보고, 그것도 안 되면 직접 복사하게
    const box = $('#copyBox');
    box.value = text; box.style.display = 'block'; box.focus(); box.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch { ok = false; }
    toast(ok ? '복사했어요 — 채팅에 붙여 넣어 주세요' : '복사가 막혔어요 — 상자 안 글을 직접 복사해 주세요');
  }
};
$('#resetBtn').onclick = () => { style.use(base); syncAll(); remember(); toast('되돌렸어요'); };

// ── 그리기 시간 ──
let frames = 0, last = performance.now(), acc = 0;
(function tick() {
  frames++; acc += style.stats().ms;
  const now = performance.now();
  if (now - last > 500) {
    const s = style.stats();
    $('#stats').textContent = `${Math.round(frames * 1000 / (now - last))} fps · 그리기 CPU ${(acc / frames).toFixed(1)}ms · 품질 ${style.quality} · ${s.passes.join(' → ')}`;
    frames = 0; acc = 0; last = now;
  }
  requestAnimationFrame(tick);
})();

syncAll();
applySplit();
</script>
</body>
</html>
