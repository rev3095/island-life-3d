<style>
/* Layout: 오르골 작업대 — 맨 위 반영 상태, 탭 넷(곡 · 언제 틀까 · 효과음 · 목소리). 곡 탭은 왼쪽 곡 목록 + 오른쪽 악보 띠·악보 글·파트·채널, 아래에 늘 붙어 있는 듣기 막대 */
:root {
  --bg: #EDF0EA;          /* 오선지 종이 */
  --panel: #FFFFFF;
  --ink: #2C3833;         /* 짙은 잎 먹색 */

  --line: #D2DAD3;
  --accent: #2E7D6C;      /* 오선 청록 */
  --accent-ink: #FFFFFF;
  --reed: #C98E1E;        /* 갈대 노랑 — 지금 소리 나는 곳 */
  --chip: #E1E8E2;
  --warn: #B4532A;
  --note: #6B5BA8;
  --roll: #F6F8F4;
  --display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121715; --panel: #1A211E; --ink: #E3EBE6; --muted: #9CABA4; --line: #2F3A35; --accent: #5FC0AA; --accent-ink: #0E1F1A;
    --reed: #E8B64E; --chip: #25302B; --warn: #EE8A62; --note: #A99BE6; --roll: #151B18; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121715; --panel: #1A211E; --ink: #E3EBE6; --muted: #9CABA4; --line: #2F3A35; --accent: #5FC0AA; --accent-ink: #0E1F1A;
  --reed: #E8B64E; --chip: #25302B; --warn: #EE8A62; --note: #A99BE6; --roll: #151B18; color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.55; }
[hidden] { display: none !important; }
.wrap { max-width: 1280px; margin: 0 auto; padding-block: 22px 110px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 18px; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; line-height: 1.2; text-wrap: balance; }

button, input, select, textarea { font: inherit; color: inherit; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn { white-space: nowrap; border: 1px solid var(--ink); background: var(--panel); border-radius: 999px; padding: 5px 14px; font-size: 14px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { border-color: var(--line); background: transparent; }
.btn.tiny { padding: 1px 10px; font-size: 12.5px; }

input[type=text], input[type=number], select, textarea { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; min-width: 0; }

label.f { display: grid; gap: 2px; font-size: 12.5px; color: var(--muted); min-width: 0; }
label.f > :is(input, select, textarea) { color: var(--ink); font-size: 14px; }
.chip { font-size: 12px; padding: 1px 9px; border-radius: 999px; background: var(--chip); white-space: nowrap; font-variant-numeric: tabular-nums; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }

/* 머리 + 반영 상태 */

/* 탭 */
.tabs { display: flex; flex-wrap: wrap; gap: 6px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }

.grid-f { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px 14px; }
.rollbox { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--roll); }
.rollbox svg { display: block; }

table.t { border-collapse: collapse; width: 100%; font-size: 14px; }
table.t th { text-align: left; font-weight: 400; color: var(--muted); font-size: 12.5px; padding: 2px 6px; }
table.t td { padding: 5px 6px; border-top: 1px solid var(--line); vertical-align: middle; }
table.t td.num { font-variant-numeric: tabular-nums; white-space: nowrap; font-family: var(--mono); font-size: 12px; }
.tbox { overflow-x: auto; }
.rng { display: grid; grid-template-columns: minmax(70px, 1fr) 52px; gap: 6px; align-items: center; min-width: 120px; }
.rng output { font-family: var(--mono); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }

/* 언제 틀까 */
.strip { display: grid; grid-template-columns: 64px repeat(24, minmax(10px, 1fr)); gap: 2px; align-items: center; font-size: 12px; min-width: 520px; }
.strip .cell { height: 26px; border-radius: 4px; }
.strip .hh { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.sched { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.srow { display: grid; grid-template-columns: 90px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.srow.time { grid-template-columns: 90px 72px minmax(0, 1fr) auto; }

/* 효과음 · 목소리 */
.fx { display: grid; gap: 8px; }
.fxrow { display: grid; grid-template-columns: 32px minmax(110px, 1.1fr) repeat(3, minmax(120px, 1fr)) auto; gap: 8px 14px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; }
.fxrow .name b { font-family: var(--display); font-weight: 400; font-size: 16px; }
.fxrow details { grid-column: 2 / -1; font-size: 13px; }
.fxrow details summary { cursor: pointer; color: var(--muted); }
.fxrow input.notein { width: 100%; }
.vrow { grid-template-columns: 32px minmax(110px, 1fr) repeat(3, minmax(120px, 1fr)) auto; }
.vrow .more { grid-column: 3 / -2; display: grid; grid-template-columns: repeat(3, minmax(110px, 1fr)); gap: 8px 14px; }

/* 듣기 막대 */
.transport { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--ink); color: var(--bg);
  padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.transport .in { max-width: 1280px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.transport .now { font-variant-numeric: tabular-nums; min-width: 0; flex: 1 1 220px; }
.transport .vol { display: flex; gap: 8px; align-items: center; flex: 0 1 220px; font-size: 13px; }
.transport .btn { background: transparent; color: var(--bg); border-color: var(--bg); }
.transport .btn.primary { background: var(--reed); color: #1F1604; border-color: var(--reed); }

@media (max-width: 860px) {
  .songs { grid-template-columns: 1fr; }
  .slist { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
  .score-grid { grid-template-columns: 1fr; }
  .fxrow, .vrow { grid-template-columns: 32px minmax(0, 1fr); }
  .fxrow > .rng, .fxrow > .acts, .vrow .more { grid-column: 1 / -1; }
  .vrow .more { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
  .fxrow details { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script type="module">
import { createEngine, volumeToGain, BUSES } from './src/audio/engine.js';
import { createMusic } from './src/audio/music.js';
import { SONGS, setSong, buildSong, ARRANGE_PARTS, ROOMS } from './src/audio/songs.js';
import { playSfx } from './src/audio/sfx.js';
import { createVoice, VOICES, VOICE_WAVES } from './src/audio/voice.js';
import { loadSound, installSound, autoSong } from './src/audio/bank.js';
import { INSTRUMENT_INFO } from './src/audio/instruments.js';
import { parseSeq, parseProg, SCALES } from './src/audio/notation.js';

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const canon = o => JSON.stringify(o);
const when = t => t ? new Date(t).toLocaleString('ko-KR', { month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
const PLAY = '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 1 L9 5 L2 9z"/></svg>';
const STOP = '<svg viewBox="0 0 10 10" aria-hidden="true"><rect x="2" y="2" width="6" height="6" rx="1"/></svg>';
const SID = Math.random().toString(36).slice(2, 10);        // 이 창 표시 (내가 저장한 초안이 되돌아올 때 다시 덮지 않게)

/* ---------- 이름표 ---------- */
const SONG_COLORS = ['#E6A24A', '#E8CD5A', '#9CC56A', '#E7876A', '#6E7FC9', '#6AAFC9', '#B98552', '#D9708F', '#9C86C9', '#7BC2A0', '#C9A26A', '#8FA3B0'];
const ROOM_LABEL = { small: '작은 방', medium: '보통 방', large: '큰 방', hall: '큰 홀' };
const SCALE_LABEL = { major: '장음계', pentatonic: '장조 5음계', minor: '단음계', minorPenta: '단조 5음계' };
const ARRANGE_LABEL = { dawn: '새벽 — 피아노 분산화음', morning: '오전 — 뒷박 마림바', afternoon: '오후 — 우쿨렐레 스트럼', evening: '저녁 — 패드와 플루트', night: '밤 — 오르골 3박자', rain: '비 — 칼림바와 빗방울', indoor: '실내 — 라디오 재즈', shop: '상점 — 통통 튀는 리듬', museum: '박물관 — 하프와 종' };
const WEATHER_LABEL = { clear: '맑음', cloudy: '흐림', rain: '비', snow: '눈', rainbow: '무지개' };
const PLACE_LABEL = { indoor: '집 안 (내 집 · 주민 집, 라디오 끔)' };
const PANEL_LABEL = { shop: '도토리상점 창', museum: '박물관 창' };
const LAYER_LABEL = { tone: '음', noise: '잡음', sweep: '휘는 잡음', bubble: '물방울', note: '악기', buzz: '윙윙' };
const VOICE_LINES = {
  coco: '오늘 바람 진짜 시원하다냥~', bori: '음… 햇볕 좋은 데서 자고 싶다멍.', mochi: '꽃에 물 줬어? 같이 하자깡!', dubu: '…낚시라면 좀 하지. 따라와.',
  pong: '복숭아 있으면 하나만 줄래꽥?', chorong: '비 온다! 오늘 운 좋은 날이개굴!', bamtol: '어서 와! 오늘의 추천은 이거야.', neuru: '오오… 이건… 아주… 귀한… 것이로군요…', player: '안녕하세요! 반가워요.',
};
const VOICE_KNOBS = [['f0', '높이', 60, 900, 1, 'Hz'], ['syl', '글자 길이', 0.04, 0.3, 0.001, '초'], ['gain', '크기', -12, 12, 0.1, 'dB'], ['gap', '글자 사이', 0, 0.12, 0.001, '초'], ['formant', '입 크기', 0.6, 1.6, 0.01, '배'], ['jitter', '흔들림', 0, 5, 0.1, '반음']];
const SFX_KNOBS = [['pitch', '높이', 0.5, 2, 0.01, '배'], ['length', '길이', 0.5, 2.5, 0.01, '배'], ['trim', '크기', -12, 24, 0.1, 'dB']];

/* ---------- 데이터 ---------- */
let base = null;          // 게임에 들어간 것 (파일) { index, songs: {id}, sfx, voices }
const work = { songs: {}, order: [], schedule: null, sfx: {}, voices: {}, notes: {} };
let applied = null, records = [], request = null;
let tab = 'songs', sel = null;

async function loadBase() {
  const data = await loadSound(url => fetch(url).then(r => { if (!r.ok) throw new Error(`${r.status}`); return r.json(); }));
  const errors = [...data.errors, ...installSound(data)];
  base = { index: data.index, songs: Object.fromEntries(data.songs.map(s => [s.id, s])), sfx: data.sfx, voices: data.voices, errors };
  work.order = [...data.index.songs];
  work.songs = clone(base.songs);
  work.schedule = clone(data.index.schedule);
  work.sfx = clone(data.sfx.sfx);
  work.voices = clone(data.voices.voices);
}
const songColor = id => SONG_COLORS[Math.max(0, work.order.indexOf(id)) % SONG_COLORS.length];
const songTitle = id => work.songs[id]?.title ?? id;
const noVersion = s => { if (!s) return s; const { version, ...rest } = s; return rest; };

/* ---------- 바뀐 것 (파일 = 게임에 들어간 것과 비교) ---------- */
const noteChanged = key => (work.notes[key] ?? '') !== (applied?.notes?.[key] ?? '');
function songChanges(id) {
  const out = [];
  const a = work.songs[id], b = base.songs[id];
  if (!b && a) out.push('새 곡');
  else if (b && !a) out.push('뺌');
  else if (canon(noVersion(a)) !== canon(noVersion(b))) out.push('고침');
  if (noteChanged(`song:${id}`)) out.push('의견');
  return out;
}
const SFX_KEYS = SFX_KNOBS.map(k => k[0]);
const VOICE_KEYS = VOICE_KNOBS.map(k => k[0]);
const pickKeys = (o, keys) => Object.fromEntries(keys.map(k => [k, o?.[k]]));
const sfxChanged = n => canon(pickKeys(work.sfx[n], SFX_KEYS)) !== canon(pickKeys(base.sfx.sfx[n], SFX_KEYS));
const voiceChanged = id => canon(pickKeys(work.voices[id], VOICE_KEYS)) !== canon(pickKeys(base.voices.voices[id], VOICE_KEYS));
const scheduleChanged = () => canon(work.schedule) !== canon(base.index.schedule);
function changes() {
  const out = [];
  for (const id of new Set([...work.order, ...Object.keys(base.songs)])) for (const c of songChanges(id)) out.push(`곡 ${songTitle(id) || id} ${c}`);
  if (scheduleChanged()) out.push('언제 틀까 고침');
  if (noteChanged('schedule')) out.push('언제 틀까 의견');
  for (const n of Object.keys(work.sfx)) { if (sfxChanged(n)) out.push(`효과음 ${work.sfx[n].label} 고침`); if (noteChanged(`sfx:${n}`)) out.push(`효과음 ${work.sfx[n].label} 의견`); }
  for (const id of Object.keys(work.voices)) { if (voiceChanged(id)) out.push(`목소리 ${work.voices[id].name} 고침`); if (noteChanged(`voice:${id}`)) out.push(`목소리 ${work.voices[id].name} 의견`); }
  return out;
}

/* ---------- 저장소: 웹 링크(아티팩트 db) 또는 로컬 dev-server ---------- */
function artifactStore(db, user) {
  return {
    label: '이 페이지의 저장소에 저장돼요 (어느 기기에서 열어도 같아요)',
    watchDoc: (path, cb) => db.doc(path).onSnapshot(s => cb(s.exists ? s.data() : null), () => {}),
    watchCol: (col, cb) => db.collection(col).onSnapshot(qs => cb(qs.docs.map(d => ({ _id: d.id, ...d.data() }))), () => {}),

/** 저장소의 초안을 화면에 (처음 한 번 + 다른 창에서 고친 것) */
const seen = {};
function applyDrafts(rows) {
  let touched = false;
  for (const d of rows) {
    const key = d._id;
    if (d.sid === SID || (seen[key] ?? 0) >= (d.updatedAt ?? 0)) continue;
    seen[key] = d.updatedAt ?? 0;
    touched = true;
    if (d.kind === 'song') {
      if (d.removed || !d.song) { if (!base.songs[d.id]) { delete work.songs[d.id]; work.order = work.order.filter(x => x !== d.id); } }
      else {
        work.songs[d.id] = d.song;
        if (!work.order.includes(d.id)) work.order.push(d.id);
        try { setSong(d.song); } catch { /* 틀린 초안은 화면에서 오류로 보인다 */ }
      }
      work.notes[`song:${d.id}`] = d.note ?? '';
    } else if (d.kind === 'schedule') {
      if (d.schedule) work.schedule = d.schedule;
      work.notes.schedule = d.note ?? '';
    } else if (d.kind === 'sfx') {
      for (const [n, v] of Object.entries(d.changes ?? {})) if (work.sfx[n]) Object.assign(work.sfx[n], v);
      for (const [n, t] of Object.entries(d.notes ?? {})) work.notes[`sfx:${n}`] = t;
    } else if (d.kind === 'voices') {
      for (const [id, v] of Object.entries(d.changes ?? {})) if (work.voices[id]) Object.assign(work.voices[id], v);
      for (const [id, t] of Object.entries(d.notes ?? {})) work.notes[`voice:${id}`] = t;
    }
  }
  if (touched) renderAll();
}

      <h3>채널 · 섞기</h3>
      <div class="tbox"><table class="t"><tr><th>채널</th><th>크기</th><th>좌우 (왼 −1 · 오른 +1)</th><th>울림 보내기</th></tr>${chRows}</table></div>
    </div>
    <div class="card">
      <label class="f">의견 (Claude 에게 — 새 반주 모양, 악기 음색 바꾸기처럼 여기서 못 고치는 것)<textarea id="s-note" rows="2">${esc(work.notes[`song:${sel}`] ?? '')}</textarea></label>
    </div>`;
  renderPlayButtons();
}

/** 악보 띠 SVG: 마디 칸 · 화음 기호 · 멜로디 음 (박당 18px) */
let roll = null;
function rollSvg(s) {
  const meter = s.meter, bars = s.bars, PX = 18, TOP = 24, H = 150;
  let seq = null, prog = null;
  try { seq = parseSeq([].concat(s.mel).join('\n'), meter); } catch {}
  try { prog = parseProg([].concat(s.prog).join('\n'), meter); } catch {}
  const W = Math.max(bars * meter, seq?.length ?? 0) * PX + 2;
  const midis = seq?.notes.map(n => n.midi) ?? [60, 72];
  const lo = Math.min(...midis) - 1, hi = Math.max(...midis) + 1;
  const y = m => TOP + 8 + (hi - m) / Math.max(1, hi - lo) * (H - TOP - 18);
  roll = { PX, W, H, meter, bars };
  let g = '';
  for (let b = 0; b < bars; b++) {
    const x = b * meter * PX;
    g += `<rect x="${x}" y="0" width="${meter * PX}" height="${H}" fill="${b % 2 ? 'var(--roll)' : 'var(--panel)'}" data-bar="${b}"/>`;
    g += `<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="var(--line)"/>`;
    g += `<text x="${x + 3}" y="${H - 4}" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${b + 1}</text>`;
    for (const c of prog?.[b] ?? []) g += `<text x="${x + c.beat * PX + 3}" y="15" font-size="11.5" fill="var(--accent)" font-family="IBM Plex Mono, monospace">${esc(c.chord.sym)}</text>`;
  }
  for (const n of seq?.notes ?? []) g += `<rect x="${n.beat * PX + 1}" y="${y(n.midi) - 4}" width="${Math.max(5, n.dur * PX - 2)}" height="8" rx="4" fill="var(--note)"/>`;
  g += `<line id="playhead" x1="0" y1="0" x2="0" y2="${H}" stroke="var(--reed)" stroke-width="2.5" visibility="hidden"/>`;
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(s.title)} 악보 띠">${g}</svg>`;
}
function drawHead(beat) {
  const h = document.getElementById('playhead');
  if (!h || !roll) return;
  if (beat == null || beat > roll.bars * roll.meter) { h.setAttribute('visibility', 'hidden'); return; }
  const x = beat * roll.PX;
  h.setAttribute('x1', x); h.setAttribute('x2', x); h.setAttribute('visibility', 'visible');
}

let scoreTimer = null;
function songEdited({ rerender = false, replay = true } = {}) {
  saveSong(sel);
  renderStatus();
  if (rerender) { renderSongs(); }
  else {
    renderSongList();
    let error = null;
    try { buildSong(work.songs[sel]); } catch (e) { error = e.message; }
    const card = $('sedit').querySelector('.card');
    card.querySelector('.err')?.remove();
    if (error) card.insertAdjacentHTML('beforeend', `<p class="err" role="alert">${esc(error)}</p>`);
  }
  if (replay) replaySong(sel);
}
$('sedit').addEventListener('input', e => {
  const t = e.target, s = work.songs[sel];
  if (!s) return;
  const out = t.nextElementSibling?.tagName === 'OUTPUT' ? t.nextElementSibling : null;
  if (out) { const unit = out.textContent.split(' ')[1]; out.textContent = `${fmtNum(t.value, Number(t.step))}${unit ? ` ${unit}` : ''}`; }
  if (t.id === 's-title') { s.title = t.value; return songEdited({ replay: false }); }
  if (t.id === 's-mood') { s.mood = t.value; return songEdited({ replay: false }); }
  if (t.id === 's-note') { work.notes[`song:${sel}`] = t.value; saveSong(sel); return renderStatus(); }
  if (t.id === 's-mel' || t.id === 's-prog') {
    s[t.id === 's-mel' ? 'mel' : 'prog'] = t.value.split('\n').map(x => x.trim()).filter(Boolean);
    clearTimeout(scoreTimer);
    scoreTimer = setTimeout(() => { $('rollbox').innerHTML = rollSvg(s); songEdited(); }, 350);
    return;
  }
  if (t.type === 'range' && t.dataset.k && !t.dataset.part && !t.dataset.ch) {
    const v = Number(t.value);
    if (t.dataset.k === 'swing' && !v) delete s.swing; else s[t.dataset.k] = v;
    return songEdited();
  }
  if (t.type === 'range' && t.dataset.part) {
    const p = s.parts[t.dataset.part], v = Number(t.value);
    if (v === 1) delete p.vel; else p.vel = v;
    return songEdited();
  }
  if (t.type === 'range' && t.dataset.ch) { s.channels[t.dataset.ch][t.dataset.k] = Number(t.value); return songEdited(); }
});
$('sedit').addEventListener('change', e => {
  const t = e.target, s = work.songs[sel];
  if (!s) return;
  if (t.id === 's-bars') { s.bars = Math.max(1, Math.min(64, Math.round(Number(t.value) || 1))); $('rollbox').innerHTML = rollSvg(s); return songEdited(); }
  if (t.id === 's-meter') { s.meter = Number(t.value); $('rollbox').innerHTML = rollSvg(s); return songEdited(); }
  if (['s-room', 's-key', 's-scale'].includes(t.id)) { s[t.dataset.k] = t.value; return songEdited(); }
  if (t.id === 's-arrange') {
    // 반주 모양을 바꾸면 그 모양을 처음 쓴 곡의 파트·채널을 가져온다 (악보·빠르기·빗소리 같은 배경 소리는 그대로)
    const src = Object.values(base.songs).find(x => x.arrange === t.value);
    s.arrange = t.value;
    if (src) { s.parts = clone(src.parts); s.channels = clone(src.channels); if (src.vibrato) s.vibrato = clone(src.vibrato); else delete s.vibrato; }
    return songEdited({ rerender: true });
  }
  if (t.dataset.part) {
    const p = s.parts[t.dataset.part];
    if (t.dataset.k === 'inst') p.inst = t.value;
    if (t.dataset.k === 'octave') { const o = Number(t.value); if (o) p.octave = o; else delete p.octave; }
    if (t.dataset.k === 'on') { if (t.checked) delete p.on; else p.on = false; }
    return songEdited();
  }
});
$('sedit').addEventListener('click', e => {
  const pb = e.target.closest('[data-play-song]');
  if (pb) { if (playing?.id === sel) { music.play(null, { fade: 0.3 }); playing = null; renderPlayButtons(); } else playSong(sel); return; }
  if (e.target.id === 's-pass2') return playSong(sel, { from: work.songs[sel].bars });
  if (e.target.id === 's-reset') { work.songs[sel] = clone(base.songs[sel]); songEdited({ rerender: true }); return; }
  if (e.target.id === 's-remove') {
    const id = sel;
    delete work.songs[id]; work.order = work.order.filter(x => x !== id);
    for (const t of work.schedule.time) if (t.song === id) t.song = base.index.schedule.time.find(x => x.part === t.part)?.song ?? '';
    saveSong(id); sel = work.order[0]; renderAll(); return;
  }
  const bar = e.target.closest?.('[data-bar]');
  if (bar) playSong(sel, { from: Number(bar.dataset.bar) });
});

/* ---------- 언제 틀까 ---------- */
function songSelect(id, cur, { empty } = {}) {
  return `<select id="${id}" aria-label="곡">${empty ? `<option value="" ${!cur ? 'selected' : ''}>${esc(empty)}</option>` : ''}${work.order.map(s => `<option value="${esc(s)}" ${cur === s ? 'selected' : ''}>${esc(songTitle(s))}</option>`).join('')}</select>`;
}
function renderSchedule() {
  const S = work.schedule;
  const sorted = { ...S, time: [...S.time].sort((a, b) => a.from - b.from) };
  const row = (label, w) => `<span class="small">${label}</span>` + Array.from({ length: 24 }, (_, h) => {
    const id = autoSong({ hour: h, weather: w }, sorted);
    return `<span class="cell" style="background:${id ? songColor(id) : 'var(--chip)'}" title="${h}시 · ${esc(songTitle(id) ?? '없음')}"></span>`;
  }).join('');
  const hours = '<span></span>' + Array.from({ length: 24 }, (_, h) => `<span class="hh">${h % 3 ? '' : h}</span>`).join('');
  const usedSongs = new Set(['clear', 'rain', 'snow'].flatMap(w => Array.from({ length: 24 }, (_, h) => autoSong({ hour: h, weather: w }, sorted))));
  $('pane-schedule').innerHTML = `
    <div class="card">
      <h2>하루 동안 바깥에서 나는 곡</h2>
      <div class="tbox"><div class="strip">${hours}${row('맑음', 'clear')}${row('비', 'rain')}${row('눈', 'snow')}</div></div>
      <div class="legend">${[...usedSongs].filter(Boolean).map(id => `<span><span class="swatch" style="background:${songColor(id)}"></span>${esc(songTitle(id))}</span>`).join('')}</div>
    </div>
    <div class="sched">
      <div class="card"><h3>시간대</h3><p class="small muted">시작 시각부터 다음 줄 전까지. 가장 이른 줄보다 이른 시각은 마지막 줄 곡이에요.</p>
        ${S.time.map((t, i) => `<div class="srow time"><span>${esc(t.label)}</span><input type="number" id="tf-${i}" min="0" max="23" value="${t.from}" data-time="${i}" aria-label="${esc(t.label)} 시작 시각"> ${songSelect(`ts-${i}`, t.song).replace('<select', `<select data-time-song="${i}"`)}
          <button type="button" class="play" data-play-song="${esc(t.song)}" aria-label="듣기">${PLAY}</button></div>`).join('')}</div>
      <div class="card"><h3>날씨 (시간대보다 먼저)</h3>
        ${Object.entries(S.weather).map(([w, v]) => `<div class="srow"><span>${esc(WEATHER_LABEL[w] ?? w)}</span>${songSelect(`ws-${w}`, v, { empty: '시간대 곡 그대로' }).replace('<select', `<select data-weather="${w}"`)}
          ${v ? `<button type="button" class="play" data-play-song="${esc(v)}" aria-label="듣기">${PLAY}</button>` : '<span></span>'}</div>`).join('')}</div>
      <div class="card"><h3>자리 · 창</h3>
        ${Object.entries(S.places).map(([k, v]) => `<div class="srow"><span class="small">${esc(PLACE_LABEL[k] ?? k)}</span>${songSelect(`pl-${k}`, v, { empty: '바깥과 같게' }).replace('<select', `<select data-place="${k}"`)}
          ${v ? `<button type="button" class="play" data-play-song="${esc(v)}" aria-label="듣기">${PLAY}</button>` : '<span></span>'}</div>`).join('')}
        ${Object.entries(S.panels).map(([k, v]) => `<div class="srow"><span class="small">${esc(PANEL_LABEL[k] ?? k)}</span>${songSelect(`pn-${k}`, v).replace('<select', `<select data-panel="${k}"`)}
          <button type="button" class="play" data-play-song="${esc(v)}" aria-label="듣기">${PLAY}</button></div>`).join('')}
        <p class="small muted">집 안 라디오를 켜면 라디오 곡(새벽~밤)이 나와요. 장면(컷신)이 고른 곡은 시나리오 편집기에서.</p></div>
    </div>
    <div class="card"><label class="f">의견 (언제 틀까)<textarea id="sched-note" rows="2">${esc(work.notes.schedule ?? '')}</textarea></label></div>`;
  renderPlayButtons();
}
$('pane-schedule').addEventListener('change', e => {
  const t = e.target, S = work.schedule;
  if (t.dataset.time != null) S.time[t.dataset.time].from = Math.max(0, Math.min(23, Math.round(Number(t.value) || 0)));
  else if (t.dataset.timeSong != null) S.time[t.dataset.timeSong].song = t.value;
  else if (t.dataset.weather) S.weather[t.dataset.weather] = t.value;
  else if (t.dataset.place) S.places[t.dataset.place] = t.value;
  else if (t.dataset.panel) S.panels[t.dataset.panel] = t.value;
  else return;
  saveSchedule(); renderSchedule(); renderSongList(); renderStatus();
});
$('pane-schedule').addEventListener('input', e => { if (e.target.id === 'sched-note') { work.notes.schedule = e.target.value; saveSchedule(); renderStatus(); } });
$('pane-schedule').addEventListener('click', e => {
  const b = e.target.closest('[data-play-song]');
  if (!b) return;
  if (playing?.id === b.dataset.playSong) { music.play(null, { fade: 0.3 }); playing = null; renderPlayButtons(); }
  else playSong(b.dataset.playSong);
});

/* ---------- 효과음 ---------- */
function layerText(l) {
  const v = x => (Array.isArray(x) ? `${x[0]}~${x[1]}` : x);
  const bits = [LAYER_LABEL[l.kind] ?? l.kind];
  if (l.kind === 'note') bits.push(`${INSTRUMENT_INFO[l.inst]?.label ?? l.inst} ${l.midi}`);
  else if (l.f != null) bits.push(`${l.type ? `${l.type} ` : ''}${v(l.f)}${l.to ? `→${v(l.to)}` : ''}Hz`);
  if (l.n) bits.push(`×${l.n}`);
  if (l.at) bits.push(`+${v(l.at)}초`);
  return bits.join(' ');
}
function renderSfx() {
  $('pane-sfx').innerHTML = `<div class="fx">
    <p class="small muted">▶ 로 들어 보고 높이·길이·크기를 바꿔요. 부를 때마다 높이가 조금씩 흔들리는 건 그대로예요. 소리 모양(층)을 바꾸고 싶으면 의견에 적어 주세요.</p>
    ${Object.entries(work.sfx).map(([n, d]) => {
      const b = base.sfx.sfx[n], ch = sfxChanged(n);
      return `<div class="fxrow">
        <button type="button" class="play" data-sfx="${esc(n)}" aria-label="${esc(d.label)} 듣기">${PLAY}</button>
        <div class="name"><b>${esc(d.label)}</b> ${ch ? '<span class="chip changed">고침</span>' : ''}${noteChanged(`sfx:${n}`) ? ' <span class="chip note">의견</span>' : ''}<div class="mono muted">${esc(n)}</div></div>
        ${SFX_KNOBS.map(([k, label, min, max, step, unit]) => `<label class="f">${label}${rng(`fx-${k}-${n}`, d[k] ?? (k === 'trim' ? 0 : 1), min, max, step, unit, `data-sfxk="${k}" data-name="${esc(n)}"`)}</label>`).join('')}
        <span class="acts"><button type="button" class="btn ghost tiny" data-sfx-reset="${esc(n)}" ${ch ? '' : 'disabled'}>원래대로</button></span>
        <details><summary>소리 층 ${d.layers.length}개 · 의견</summary>
          <p class="small muted">${d.layers.map(layerText).map(esc).join(' · ')}</p>
          <input type="text" class="notein" id="fxn-${esc(n)}" data-sfx-note="${esc(n)}" value="${esc(work.notes[`sfx:${n}`] ?? '')}" placeholder="의견 (예: 더 통통하게, 물방울 많이)">
        </details>
      </div>`;
    }).join('')}</div>`;
}
$('pane-sfx').addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.sfxk) {
    const d = work.sfx[t.dataset.name];
    d[t.dataset.sfxk] = Number(t.value);
    const out = t.nextElementSibling, unit = out.textContent.split(' ')[1];
    out.textContent = `${fmtNum(t.value, Number(t.step))} ${unit}`;
    saveSfx(); renderStatus();
    clearTimeout(t._t); t._t = setTimeout(() => previewSfx(t.dataset.name), 180);
  }
  if (t.dataset.sfxNote) { work.notes[`sfx:${t.dataset.sfxNote}`] = t.value; saveSfx(); renderStatus(); }
});
$('pane-sfx').addEventListener('change', e => { if (e.target.dataset.sfxk) renderSfx(); });
$('pane-sfx').addEventListener('click', e => {
  const b = e.target.closest('[data-sfx]');
  if (b) return previewSfx(b.dataset.sfx);
  const r = e.target.closest('[data-sfx-reset]');
  if (r) { const n = r.dataset.sfxReset; Object.assign(work.sfx[n], pickKeys(base.sfx.sfx[n], SFX_KEYS)); saveSfx(); renderSfx(); renderStatus(); }
});
function previewSfx(n) { if (unlock()) playSfx(engine, n, {}, work.sfx[n]); }

/* ---------- 목소리 ---------- */
function renderVoices() {
  $('pane-voices').innerHTML = `<div class="fx">
    <label class="f">들어 볼 말 (비우면 캐릭터마다 예시 대사)<input type="text" id="vline" value="" placeholder="예: 안녕! 오늘 날씨 정말 좋다."></label>
    ${Object.entries(work.voices).map(([id, v]) => {
      const ch = voiceChanged(id);
      const knob = ([k, label, min, max, step, unit]) => `<label class="f">${label}${rng(`vk-${k}-${id}`, v[k] ?? 0, min, max, step, unit, `data-vk="${k}" data-voice="${id}"`)}</label>`;
      return `<div class="fxrow vrow">
        <button type="button" class="play" data-speak="${id}" aria-label="${esc(v.name)} 목소리 듣기">${PLAY}</button>
        <div class="name"><b>${esc(v.name)}</b> ${ch ? '<span class="chip changed">고침</span>' : ''}${noteChanged(`voice:${id}`) ? ' <span class="chip note">의견</span>' : ''}<div class="small muted">${esc(v.desc)} · <span class="mono">${esc(id)}</span></div></div>
        ${VOICE_KNOBS.slice(0, 3).map(knob).join('')}
        <span class="acts"><button type="button" class="btn ghost tiny" data-voice-reset="${id}" ${ch ? '' : 'disabled'}>원래대로</button></span>
        <div class="more">${VOICE_KNOBS.slice(3).map(knob).join('')}</div>
        <details><summary>의견</summary><input type="text" class="notein" id="vn-${id}" data-voice-note="${id}" value="${esc(work.notes[`voice:${id}`] ?? '')}" placeholder="의견 (예: 조금 더 졸린 말투로)"></details>
      </div>`;
    }).join('')}</div>`;
}
$('pane-voices').addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.vk) {
    work.voices[t.dataset.voice][t.dataset.vk] = Number(t.value);
    const out = t.nextElementSibling, unit = out.textContent.split(' ')[1];
    out.textContent = `${fmtNum(t.value, Number(t.step))} ${unit}`;
    saveVoices(); renderStatus();
  }
  if (t.dataset.voiceNote) { work.notes[`voice:${t.dataset.voiceNote}`] = t.value; saveVoices(); renderStatus(); }
});
$('pane-voices').addEventListener('change', e => { if (e.target.dataset.vk) { renderVoices(); speak(e.target.dataset.voice); } });
$('pane-voices').addEventListener('click', e => {
  const b = e.target.closest('[data-speak]');
  if (b) return speak(b.dataset.speak);
  const r = e.target.closest('[data-voice-reset]');
  if (r) { const id = r.dataset.voiceReset; Object.assign(work.voices[id], pickKeys(base.voices.voices[id], VOICE_KEYS)); saveVoices(); renderVoices(); renderStatus(); }
});
function speak(id) {
  if (!unlock()) return;
  VOICES[id] = work.voices[id];                 // 고친 값으로 바로
  voice.speak($('vline')?.value.trim() || VOICE_LINES[id] || '안녕하세요!', id);
}

/* ---------- 탭 ---------- */
const TABS = ['songs', 'schedule', 'sfx', 'voices'];
function showTab(t) {
  tab = TABS.includes(t) ? t : 'songs';
  for (const b of document.querySelectorAll('.tab')) b.setAttribute('aria-selected', String(b.dataset.tab === tab));
  for (const k of TABS) $(`pane-${k}`).hidden = k !== tab;
  try { localStorage.setItem('sound-editor-tab', tab); } catch {}
  if (location.hash !== `#${tab}`) history.replaceState?.(null, '', `#${tab}`);
}
document.querySelector('.tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) showTab(b.dataset.tab); });
function renderAll() {
  if (!work.songs[sel]) sel = work.order[0];
  renderSongs(); renderSchedule(); renderSfx(); renderVoices(); renderStatus();
}

/* ---------- 시작 ---------- */
window.__sound = { work, get base() { return base; }, get engine() { return engine; }, get music() { return music; } };   // 개발 확인용
try {
  await loadBase();
  sel = work.order[0];
  let first = location.hash.slice(1);
  if (!TABS.includes(first)) { try { first = localStorage.getItem('sound-editor-tab'); } catch {} }
  showTab(first);
  renderAll();
} catch (e) {
  $('status').innerHTML = `<p class="err">소리 데이터를 읽지 못했어요 (${esc(e.message)}). 페이지를 새로 고쳐 보세요.</p>`;
  throw e;
}
store = await connectStore();
if (store) {
  me = await store.who();
  writable = await store.canWrite();
  saveMsg = writable ? '고치면 바로 저장돼요' : '보기 권한이에요. 미리 듣기는 되지만 저장은 안 돼요.';
  store.watchDoc('applied/sound', d => { applied = d; renderStatus(); renderSongList(); });
  store.watchDoc('requests/sound', d => { request = d; renderStatus(); });
  store.watchCol('history', rows => { records = rows.filter(r => r.board === 'sound').sort((a, b) => b.version - a.version); renderStatus(); });
  store.watchCol('drafts', applyDrafts);
} else saveMsg = '저장소에 연결하지 못했어요. 고친 내용은 창을 닫으면 사라져요 (미리 듣기는 돼요).';
renderStatus();
</script>
