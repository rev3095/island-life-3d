<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 휴대폰: 노치까지 화면을 쓰고(안전 영역은 --safe-* 로 피한다), 글자 입력 때 자판만큼 화면이 줄어든다 -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#BFE6F7">
<meta name="format-detection" content="telephone=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="포근섬">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>포근섬 이야기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
  /* 게임 화면 기본 틀. HUD·창 모양은 ui 모듈(src/ui/ui.css), 휴대폰 패드·A/B 모양은 core/input.js 가 맡는다. */
  :root {
    --ink: #4A3B32; --cream: #FFF8E6; --display: "Jua", "Malgun Gothic", sans-serif; --body: "Gowun Dodum", "Malgun Gothic", sans-serif;
    /* 안전 영역(노치·홈 막대). ui.css·input.js 가 이 값을 쓴다 — 확인할 때 html 에 덮어써서 노치를 흉내 낼 수 있다 */
    --safe-top: env(safe-area-inset-top, 0px); --safe-right: env(safe-area-inset-right, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px); --safe-left: env(safe-area-inset-left, 0px);
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #BFE6F7; color: var(--ink); font-family: var(--body);
    overscroll-behavior: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; -webkit-touch-callout: none; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* 창 안 스크롤은 되고, 두 손가락 확대·두 번 눌러 확대는 막는다 */
  #ui { position: fixed; inset: 0; pointer-events: none; font-family: var(--body); touch-action: pan-x pan-y; }
  #ui > * { pointer-events: auto; }
  .core-check { position: absolute; left: 50%; top: calc(16px + var(--safe-top)); transform: translateX(-50%);
    background: var(--cream); padding: 6px 14px; border-radius: 999px; font-size: 14px; box-shadow: 0 3px 0 #E2D2AE; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="game" aria-label="포근섬 게임 화면"></canvas>
<div id="ui"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
